name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: swift build
      - name: Build (release)
        run: swift build -c release
      - name: Tests
        run: swift test
      - name: Editing self-test (typing, dragging, undo, import, export; no window shows)
        run: .build/debug/Schema --selftest
      - name: A dump of four databases imports, and its rows are skipped
        run: |
          out=$(mktemp -d)
          python3 Resources/make-sample-dump.py --scale 0.01 --out "$out"
          .build/debug/Schema --inspect="$out/maben-sample-4-databases-postgres.sql" | tee "$out/pg.txt"
          grep -q "^45 tables, 50 foreign keys" "$out/pg.txt"
          .build/debug/Schema --inspect="$out/maben-sample-4-databases-mysql.sql" | tee "$out/my.txt"
          grep -q "^45 tables, 51 foreign keys" "$out/my.txt"
      - name: The sample exports as SQL, a picture and a file that opens again
        run: |
          out=$(mktemp -d)
          .build/debug/Schema --export="$out/shop.sql" && grep -q "CREATE TABLE customer (" "$out/shop.sql"
          .build/debug/Schema --export="$out/shop.pdf" && head -c 4 "$out/shop.pdf" | grep -q "%PDF"
          .build/debug/Schema --export="$out/shop.asta" && unzip -l "$out/shop.asta" | grep -q " EntityStore$"
          .build/debug/Schema --export="$out/shop.mschema"
          grep -q '"version" : 1' "$out/shop.mschema"
          .build/debug/Schema --open="$out/shop.mschema" --export="$out/again.sql" && cmp "$out/shop.sql" "$out/again.sql"
      - name: A diagram with one of everything exports, and SQLite takes its SQL
        run: |
          out=$(mktemp -d)
          .build/debug/Schema --features --dialect=sqlite --export="$out/all.sql" && sqlite3 :memory: < "$out/all.sql"
          .build/debug/Schema --dialect=sqlite --export="$out/shop.sql" && sqlite3 :memory: < "$out/shop.sql"
          grep -q "CREATE INDEX ix_person_name_kind" "$out/all.sql"
          .build/debug/Schema --features --export="$out/all.mschema" && grep -q '"version" : 2' "$out/all.mschema"
          .build/debug/Schema --open="$out/all.mschema" --dialect=sqlite --export="$out/again.sql" && cmp "$out/all.sql" "$out/again.sql"
          .build/debug/Schema --features --export="$out/all.asta" && unzip -l "$out/all.asta" | grep -q " EntityStore$"
      - name: The data dictionary is an Excel file that comes back as the same tables; SVG and the document are well-formed
        run: |
          out=$(mktemp -d)
          .build/debug/Schema --export="$out/shop.xlsx" && unzip -tq "$out/shop.xlsx"
          .build/debug/Schema --from-sheet="$out/shop.xlsx" --export="$out/back.sql" && grep -c "^CREATE TABLE" "$out/back.sql" | grep -q "^8$"
          .build/debug/Schema --features --export="$out/all.svg" && xmllint --noout "$out/all.svg"
          .build/debug/Schema --features --activity --export="$out/flow.svg" && xmllint --noout "$out/flow.svg" && grep -q ">Check stock<" "$out/flow.svg"
          .build/debug/Schema --features --only-activities --export="$out/flow.asta" && unzip -l "$out/flow.asta" | grep -q " EntityStore$"
          .build/debug/Schema --features --export="$out/all.astalist" && grep -q "^ACTIVITY Order flow|nodes=18|flows=17|lanes=3" "$out/all.astalist"
          .build/debug/Schema --features --export="$out/all.html" && grep -q "<h2 id=\"person\">Person</h2>" "$out/all.html"
          .build/debug/Schema --features --sql-options=drop,quote,after,ifnotexists --dialect=sqlite --export="$out/opts.sql" && sqlite3 :memory: < "$out/opts.sql"
      - name: A script changes the diagram, and a compare with itself finds nothing
        run: |
          out=$(mktemp -d)
          echo "addEntity('Audit', ['*id integer auto', 'what text']); log(diagram.entities.length);" > "$out/add.js"
          .build/debug/Schema --script="$out/add.js" --export="$out/more.sql" | grep -q "^9$"
          grep -q "CREATE TABLE audit (" "$out/more.sql"
          .build/debug/Schema --features --export="$out/all.mschema"
          .build/debug/Schema --open="$out/all.mschema" --compare="$out/all.mschema" | grep -q "^0 only here, 0 only in all.mschema, 0 different$"
      - name: Scripts parse
        run: |
          zsh -n release.sh
          zsh -n publish.sh
          sh -n build.sh
      - name: Version has a changelog entry
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
