name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: If it's about an import, say which database the SQL came from. Remove anything private.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Maben Schema version
      description: Maben Schema › About Maben Schema
      placeholder: "0.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.5, MacBook Air M3
  - type: textarea
    id: sql
    attributes:
      label: SQL or diagram
      description: Optional. The CREATE TABLE statements that import wrongly, or the SQL the app wrote. Only the table definitions are needed, never the data. Remove anything private.
      render: sql
