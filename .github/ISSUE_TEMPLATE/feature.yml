name: Idea
description: Suggest something new or better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: For a notation or a kind of SQL the app should read or write, a small example helps most.
